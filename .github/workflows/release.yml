name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm run test:unit
          echo "✅ All tests passed for release ${{ steps.version.outputs.version }}"

      - name: Build application
        run: npm run build

      - name: Generate static site
        run: npm run generate

      - name: Create release tarball
        run: |
          cd .output/public
          tar -czf ../../blackout-web-${{ steps.version.outputs.version }}.tar.gz .
          cd ../..
          echo "📦 Created release tarball: blackout-web-${{ steps.version.outputs.version }}.tar.gz"

      - name: Generate checksums
        run: |
          sha256sum blackout-web-${{ steps.version.outputs.version }}.tar.gz > checksums.txt
          cat checksums.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=stable

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64

      - name: Generate comprehensive SBOM
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: 'cyclonedx'
          output: 'sbom-${{ steps.version.outputs.version }}.json'

      - name: Sign container image (optional - requires setup)
        if: false  # Enable when cosign is configured
        run: |
          echo "🔐 Image signing with cosign disabled (requires setup)"
          echo "To enable: install cosign and configure COSIGN_KEY secret"
          # cosign sign --key env://COSIGN_KEY ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            blackout-web-${{ steps.version.outputs.version }}.tar.gz
            checksums.txt
            sbom-${{ steps.version.outputs.version }}.json
          body: |
            ## 🚀 Release ${{ steps.version.outputs.version }}

            ### Docker Images

            Pull the release image:
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```

            **Multi-platform support:** `linux/amd64`, `linux/arm64`

            **Image digest:** `${{ steps.build.outputs.digest }}`

            ### Static Build

            Download the static build tarball for self-hosting:
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/blackout-web-${{ steps.version.outputs.version }}.tar.gz
            tar -xzf blackout-web-${{ steps.version.outputs.version }}.tar.gz
            ```

            ### Verification

            Verify checksums:
            ```bash
            sha256sum -c checksums.txt
            ```

            ### SBOM

            Software Bill of Materials (SBOM) is attached to this release for security and compliance tracking.

            ---

            **⚠️ Deployment Note:** This release is ready for deployment to your self-hosted infrastructure. Follow your internal deployment procedures to promote to production.

  deploy-production-stub:
    name: Production Deployment (Stub)
    runs-on: ubuntu-latest
    needs: build-release
    environment:
      name: production
      url: https://blackout-industries.com
    steps:
      - name: Deployment instructions
        run: |
          echo "🎯 Production Deployment Ready"
          echo "================================"
          echo ""
          echo "Release: ${{ needs.build-release.outputs.version }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-release.outputs.version }}"
          echo "Digest: ${{ needs.build-release.outputs.image-digest }}"
          echo ""
          echo "⚠️  MANUAL DEPLOYMENT REQUIRED"
          echo ""
          echo "This workflow does not automatically deploy to production."
          echo "Deploy to your self-hosted infrastructure using:"
          echo ""
          echo "1. Pull the release image:"
          echo "   docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-release.outputs.version }}"
          echo ""
          echo "2. OR download static build:"
          echo "   wget https://github.com/${{ github.repository }}/releases/download/${{ needs.build-release.outputs.version }}/blackout-web-${{ needs.build-release.outputs.version }}.tar.gz"
          echo ""
          echo "3. Deploy using your hosting platform"
          echo ""
          echo "4. Run production smoke tests"
          echo ""
          echo "5. Update DNS/CDN if needed"

      - name: Create deployment record
        run: |
          echo "PRODUCTION_VERSION=${{ needs.build-release.outputs.version }}" >> $GITHUB_ENV
          echo "PRODUCTION_IMAGE_DIGEST=${{ needs.build-release.outputs.image-digest }}" >> $GITHUB_ENV
          echo "PRODUCTION_RELEASE_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo ""
          echo "✅ Release ${{ needs.build-release.outputs.version }} is ready for production deployment"
