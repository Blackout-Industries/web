name: Main Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Generate static site
        run: npm run generate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .output/
          retention-days: 7

  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        scan-type: [container, dependencies]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Container)
        if: matrix.scan-type == 'container'
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (Dependencies)
        if: matrix.scan-type == 'dependencies'
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build-and-push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scans]
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          provenance: false
          sbom: false

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  deploy-production:
    name: Deploy to Production (Raspberry Pi)
    runs-on: [web, production]
    needs: build-and-push-image
    environment:
      name: production
      url: https://blackout-industries.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest image
        run: |
          IMAGE_NAME="ghcr.io/blackout-industries/web:latest"
          echo "📦 Pulling image: $IMAGE_NAME"
          docker pull $IMAGE_NAME

          echo "✅ Image pulled successfully"
          docker images | grep blackout-industries/web

      - name: Stop existing deployment
        working-directory: deploy
        run: |
          echo "🛑 Stopping existing containers..."
          docker compose -f docker-compose.prod.yml down || true

      - name: Deploy with Docker Compose
        working-directory: deploy
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          echo "🚀 Starting deployment..."
          docker compose -f docker-compose.prod.yml up -d

          echo "⏳ Waiting for services to stabilize..."
          sleep 15

      - name: Health checks
        working-directory: deploy
        run: |
          echo "🔍 Running health checks..."
          echo ""

          # Check container status
          echo "📊 Container Status:"
          docker compose -f docker-compose.prod.yml ps
          echo ""

          # Check web container health
          echo "🌐 Web Container Health:"
          if docker exec blackout-web wget --quiet --tries=1 --spider http://localhost:80/; then
            echo "✅ Web container is healthy"
          else
            echo "❌ Web container health check failed"
            exit 1
          fi
          echo ""

          # Check cloudflared tunnel
          echo "🚇 Cloudflare Tunnel Status:"
          if docker exec cloudflared-tunnel cloudflared tunnel info 2>&1 | grep -q "Registered"; then
            echo "✅ Cloudflare Tunnel is connected"
          else
            echo "⚠️  Cloudflare Tunnel check inconclusive (may still be connecting)"
          fi

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo ""
          echo "📦 Image: ${{ needs.build-and-push-image.outputs.image-tags }}"
          echo "🔐 Digest: ${{ needs.build-and-push-image.outputs.image-digest }}"
          echo "🌐 URL: https://blackout-industries.com"
          echo "⏰ Deployed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

      - name: Comment on commit
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## 🚀 Production Deployment Successful\n\n**Image:** \`${{ needs.build-and-push-image.outputs.image-tags }}\`\n**Digest:** \`${{ needs.build-and-push-image.outputs.image-digest }}\`\n**Environment:** Raspberry Pi 4 (ARM64)\n**URL:** https://blackout-industries.com\n\n### Services Deployed:\n- ✅ Web application (nginx + static site)\n- ✅ Cloudflare Tunnel (secure ingress)\n- ✅ Watchtower (auto-updates)\n\n**Deployed at:** ${new Date().toISOString()}`
            })
