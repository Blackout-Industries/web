# Production deployment for Raspberry Pi with Cloudflare Tunnel
# Security-hardened setup with network isolation

version: '3.8'

services:
  # Main web application
  web:
    image: ghcr.io/blackout-industries/web:latest
    container_name: blackout-web
    restart: unless-stopped
    networks:
      - internal
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # No ports exposed - only accessible via cloudflared tunnel
    # ports:
    #   - "8080:80"  # Only enable for local testing

  # Cloudflare Tunnel daemon
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel run
    networks:
      - internal
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Auto-update containers (optional)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --interval 3600 --cleanup

networks:
  internal:
    driver: bridge
    internal: false  # Set to true for maximum isolation (disables internet access)
